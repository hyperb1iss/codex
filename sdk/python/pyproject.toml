[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-sdk"
version = "0.0.0.dev0"
description = "Python SDK for Codex (wraps the local codex CLI)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "OpenAI" }]
keywords = ["openai", "codex", "sdk", "python"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]
dependencies = [
  "typing-extensions>=4.0.0",
]

[dependency-groups]
dev = [
  "pyright>=1.1.392",
  "ruff>=0.9.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_sdk = ["py.typed"]

[tool.ruff]
target-version = "py39"
line-length = 88
extend-exclude = [".venv", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.9"
typeCheckingMode = "basic"
include = ["src", "tests", "examples"]
exclude = [".venv", "dist", "build"]
